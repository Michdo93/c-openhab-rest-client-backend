name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image (as on Render)
        run: docker build -t backend .
      - name: Health check
        run: |
          docker run -d -p 8080:8080 --name backend backend
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '"2.0.0"'
